server:
  port: 8181

spring:
  config:
    import: env.properties
  application:
    name: core
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true

client:
  url: ${FRONT_URL}

logging:
  level:
    org:
      springframework.web: TRACE
      hibernate: ERROR

springdoc:
  swagger-ui:
    csrf:
      enabled: true
